<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Humanic AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            color: #fff;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── Video Layer ── */
        .video-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .video-layer video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #idle-video {
            z-index: 1;
        }

        #talking-video {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        #talking-video.active {
            opacity: 1;
        }

        /* ── Overlay UI ── */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .overlay>* {
            pointer-events: auto;
        }

        /* ── Top Bar ── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 0.4rem 1rem;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-dot.live {
            background: #00e676;
            box-shadow: 0 0 8px #00e676;
        }

        .emotion-display {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 0.4rem 1rem;
            font-size: 0.82rem;
            transition: all 0.3s;
        }

        /* ── Chat Overlay (bottom half, transparent) ── */
        .chat-area {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            height: 35vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0 1.5rem 0.5rem;
            z-index: 10;
            pointer-events: none;
            background: none;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
            scrollbar-width: none;
            pointer-events: auto;
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
        }

        .chat-messages::-webkit-scrollbar {
            display: none;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 0.6rem 1rem;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.5;
            animation: fadeUp 0.25s ease;
            backdrop-filter: blur(16px);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: rgba(124, 92, 255, 0.35);
            border: 1px solid rgba(124, 92, 255, 0.25);
        }

        .chat-bubble.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-bubble.system {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-bubble .transcript-tag {
            font-size: 0.68rem;
            color: rgba(124, 220, 155, 0.8);
            margin-bottom: 0.2rem;
        }

        .stream-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #fff;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* ── Bottom Controls ── */
        .bottom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            padding: 1rem 1.5rem 2rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
        }

        .btn-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(12px);
        }

        .btn-icon:active {
            transform: scale(0.92);
        }

        .btn-connect {
            background: rgba(124, 92, 255, 0.5);
            border: 1px solid rgba(124, 92, 255, 0.4);
            color: #fff;
        }

        .btn-connect:hover {
            background: rgba(124, 92, 255, 0.7);
        }

        .btn-connect.connected {
            background: rgba(255, 77, 106, 0.5);
            border-color: rgba(255, 77, 106, 0.4);
        }

        .btn-mic {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.5), rgba(0, 200, 83, 0.5));
            border: 2px solid rgba(0, 230, 118, 0.3);
            color: #fff;
            font-size: 1.6rem;
            box-shadow: 0 4px 30px rgba(0, 230, 118, 0.15);
        }

        .btn-mic:hover {
            box-shadow: 0 4px 30px rgba(0, 230, 118, 0.3);
        }

        .btn-mic.recording {
            background: linear-gradient(135deg, rgba(255, 34, 34, 0.6), rgba(204, 0, 0, 0.6));
            border-color: rgba(255, 34, 34, 0.4);
            animation: pulse-ring 0.9s infinite;
        }

        .btn-mic:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            animation: none;
        }

        @keyframes pulse-ring {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 34, 34, 0.4);
            }

            50% {
                box-shadow: 0 0 0 12px rgba(255, 34, 34, 0);
            }
        }

        .btn-voice {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
        }

        .btn-voice.active {
            background: rgba(124, 92, 255, 0.3);
            border-color: rgba(124, 92, 255, 0.3);
            color: #fff;
        }

        /* Voice selector dropdown */
        .voice-select {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 0.5rem 0.8rem;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
            max-width: 140px;
        }

        .voice-select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* ── Connect Screen ── */
        .connect-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            transition: opacity 0.4s ease;
        }

        .connect-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .connect-screen h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c5cff, #ff6ec7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .connect-screen p {
            color: #888;
            font-size: 0.9rem;
            max-width: 320px;
            text-align: center;
            line-height: 1.6;
        }

        .btn-start {
            padding: 0.9rem 2.5rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #7c5cff, #6a4fff);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.03em;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 92, 255, 0.4);
        }
    </style>
</head>

<body>

    <!-- Video Layer -->
    <div class="video-layer">
        <video id="idle-video" src="/idle.mp4" loop muted playsinline autoplay></video>
        <video id="talking-video" src="/talking.mp4" loop muted playsinline></video>
    </div>

    <!-- Connect Screen -->
    <div class="connect-screen" id="connectScreen">
        <h1>Humanic AI</h1>
        <p>Your emotionally intelligent AI companion. Tap below to connect and start talking.</p>
        <button class="btn-start" id="startBtn" onclick="connect()">Connect</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"
        style="position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 8px; pointer-events: none;">
    </div>

    <!-- Overlay UI -->
    <div class="overlay" id="mainUI" style="display:none;">
        <!-- Top bar -->
        <div class="top-bar">
            <div class="status-pill">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="emotion-display" id="emotionDisplay">😐 Neutral</div>
        </div>

        <!-- Chat area -->
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages"></div>
        </div>

        <!-- Bottom controls -->
        <div class="bottom-controls">
            <button class="btn-icon btn-voice" id="voiceBtn" onclick="toggleVoice()" title="Toggle AI voice">🔇</button>
            <select class="voice-select" id="voiceSelect" title="Choose voice">
                <option value="">Loading...</option>
            </select>
            <button class="btn-icon btn-mic" id="micBtn" disabled onmousedown="startMic()" onmouseup="stopMic()"
                ontouchstart="startMic(event)" ontouchend="stopMic(event)">🎤</button>
            <button class="btn-icon btn-connect connected" id="disconnectBtn" onclick="disconnect()"
                title="Disconnect">📵</button>
        </div>
    </div>

    <script>
        // ── State ──
        let ws = null;
        let currentSessionId = null;
        let currentBubble = null;
        let currentTextSpan = null;

        // Audio
        let audioChunks = [];
        let currentAudioEl = null;
        let voiceEnabled = false;

        // Mic
        let micStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];

        const EMOTION_EMOJI = {
            Happy: '😊', Sad: '😢', Anxious: '😰', Excited: '🤩',
            Calm: '😌', Angry: '😤', Tender: '🥰', Curious: '🤔',
            Playful: '😜', Neutral: '😐'
        };

        // ── Load voices ──
        let selectedVoiceId = '';
        (async () => {
            try {
                const r = await fetch('/voices');
                const data = await r.json();
                const sel = document.getElementById('voiceSelect');
                sel.innerHTML = '';
                if (data.voices && data.voices.length > 0) {
                    data.voices.forEach(v => {
                        const opt = document.createElement('option');
                        opt.value = v.id;
                        opt.textContent = v.name;
                        sel.appendChild(opt);
                    });
                    selectedVoiceId = data.voices[0].id;
                }
                sel.addEventListener('change', () => { selectedVoiceId = sel.value; });
            } catch (e) { console.warn('Could not load voices', e); }
        })();

        // ── Connect ──
        function connect() {
            const userId = 'avatar_user';
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/chat/${userId}`);

            ws.onopen = () => {
                document.getElementById('connectScreen').classList.add('hidden');
                document.getElementById('mainUI').style.display = '';
                document.getElementById('statusDot').classList.add('live');
                document.getElementById('statusText').textContent = 'Connected';
                document.getElementById('micBtn').disabled = false;

                // Pre-load talking video
                document.getElementById('talking-video').play().catch(() => { });

                showToast('🟢 Connected — hold the mic to speak');

                // Load history if we have a session
                if (currentSessionId) loadHistory(currentSessionId);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('live');
                document.getElementById('statusText').textContent = 'Disconnected';
                document.getElementById('micBtn').disabled = true;
                showToast('🔴 Disconnected');
            };

            ws.onerror = () => {
                showToast('❌ Connection error');
            };
        }

        function disconnect() {
            if (ws) ws.close();
            document.getElementById('connectScreen').classList.remove('hidden');
            document.getElementById('mainUI').style.display = 'none';
            stopTalkingVideo();
        }

        // ── Message handler ──
        let pendingBubble = null;  // hidden bubble waiting for audio sync

        function handleMessage(data) {
            switch (data.type) {
                case 'session':
                    currentSessionId = data.session_id;
                    break;

                case 'transcript':
                    if (data.text) {
                        const b = addBubble('user', '');
                        b.innerHTML = `<div class="transcript-tag">🎤 voice</div>${data.text}`;
                    } else {
                        showToast('🎤 No speech detected');
                    }
                    document.getElementById('micBtn').disabled = false;
                    break;

                case 'control': {
                    const emoji = EMOTION_EMOJI[data.emotion] || '😐';
                    document.getElementById('emotionDisplay').textContent = `${emoji} ${data.emotion}`;
                    // Start AI bubble
                    currentBubble = addBubble('ai', '');
                    currentTextSpan = document.createElement('span');
                    currentBubble.appendChild(currentTextSpan);
                    const cursor = document.createElement('span');
                    cursor.className = 'stream-cursor';
                    cursor.id = 'activeCursor';
                    currentBubble.appendChild(cursor);

                    // If voice enabled, hide bubble until audio plays
                    if (voiceEnabled) {
                        currentBubble.style.opacity = '0';
                        currentBubble.style.height = '0';
                        currentBubble.style.overflow = 'hidden';
                        currentBubble.style.padding = '0';
                        currentBubble.style.margin = '0';
                        pendingBubble = currentBubble;
                    }
                    break;
                }

                case 'stream':
                    if (currentTextSpan) {
                        currentTextSpan.textContent += data.token;
                        if (!pendingBubble) scrollChat();  // only scroll if visible
                    }
                    break;

                case 'audio_start':
                    audioChunks = [];
                    break;

                case 'audio':
                    collectAudioChunk(data.data);
                    break;

                case 'audio_end':
                    playCollectedAudio();
                    break;

                case 'end': {
                    const c = document.getElementById('activeCursor');
                    if (c) c.remove();
                    // If bubble was hidden (no audio came), reveal it now
                    if (pendingBubble) revealPendingBubble();
                    currentBubble = null;
                    currentTextSpan = null;
                    document.getElementById('micBtn').disabled = false;
                    break;
                }

                case 'error':
                    showToast(`⚠️ ${data.detail}`);
                    document.getElementById('micBtn').disabled = false;
                    break;
            }
        }

        function revealPendingBubble() {
            if (!pendingBubble) return;
            pendingBubble.style.opacity = '';
            pendingBubble.style.height = '';
            pendingBubble.style.overflow = '';
            pendingBubble.style.padding = '';
            pendingBubble.style.margin = '';
            pendingBubble = null;
            scrollChat();
        }

        // ── Video switching ──
        function startTalkingVideo() {
            const tv = document.getElementById('talking-video');
            tv.play().catch(() => { });
            tv.classList.add('active');
        }

        function stopTalkingVideo() {
            document.getElementById('talking-video').classList.remove('active');
        }

        // ── Audio playback ──
        function collectAudioChunk(base64Data) {
            const binary = atob(base64Data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            audioChunks.push(bytes);
        }

        function playCollectedAudio() {
            if (audioChunks.length === 0) { stopTalkingVideo(); return; }
            if (currentAudioEl) {
                currentAudioEl.pause();
                URL.revokeObjectURL(currentAudioEl.src);
            }
            const blob = new Blob(audioChunks, { type: 'audio/mpeg' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.onplay = () => {
                startTalkingVideo();  // Only show talking video when audio actually plays
                revealPendingBubble();  // Sync chat text with audio
            };
            audio.onended = () => {
                URL.revokeObjectURL(url);
                currentAudioEl = null;
                stopTalkingVideo();
            };
            audio.onerror = () => {
                stopTalkingVideo();
            };
            currentAudioEl = audio;
            audio.play();
        }

        // ── Voice toggle ──
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceBtn');
            btn.textContent = voiceEnabled ? '🔊' : '🔇';
            btn.classList.toggle('active', voiceEnabled);
        }

        // ── Mic (hold to talk) ──
        async function ensureMicStream() {
            if (micStream && micStream.active) return micStream;
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            return micStream;
        }

        async function startMic(e) {
            if (e) e.preventDefault();
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (mediaRecorder && mediaRecorder.state === 'recording') return;

            try {
                const stream = await ensureMicStream();
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });

                mediaRecorder.ondataavailable = (ev) => {
                    if (ev.data.size > 0) recordedChunks.push(ev.data);
                };

                mediaRecorder.onstop = () => {
                    if (recordedChunks.length === 0) return;

                    // Send config so server knows voice_id
                    const voiceId = voiceEnabled ? selectedVoiceId : '';
                    ws.send(JSON.stringify({
                        type: 'config',
                        voice_id: voiceId,
                        role: 'friend',
                        session_id: currentSessionId || '',
                    }));

                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    ws.send(blob);
                    document.getElementById('micBtn').disabled = true;
                    mediaRecorder = null;
                };

                mediaRecorder.start();
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').textContent = '⏹️';
            } catch (err) {
                console.error('Mic error', err);
                showToast('❌ Mic access denied');
            }
        }

        function stopMic(e) {
            if (e) e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                document.getElementById('micBtn').classList.remove('recording');
                document.getElementById('micBtn').textContent = '🎤';
            }
        }

        // ── Chat bubbles ──
        function addBubble(type, text) {
            const container = document.getElementById('chatMessages');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${type}`;
            bubble.textContent = text;
            container.appendChild(bubble);
            scrollChat();

            // Keep only last 30 bubbles
            while (container.children.length > 30) container.removeChild(container.firstChild);
            return bubble;
        }

        function scrollChat() {
            const c = document.getElementById('chatMessages');
            c.scrollTop = c.scrollHeight;
        }

        // ── Toast System ──
        function showToast(text) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.style.background = 'rgba(0, 0, 0, 0.6)';
            toast.style.backdropFilter = 'blur(10px)';
            toast.style.border = '1px solid rgba(255, 255, 255, 0.1)';
            toast.style.borderRadius = '20px';
            toast.style.padding = '0.5rem 1rem';
            toast.style.color = '#fff';
            toast.style.fontSize = '0.85rem';
            toast.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
            toast.style.animation = 'fadeInOut 4s forwards';
            toast.textContent = text;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInOut {
                0% { opacity: 0; transform: translateY(-10px); }
                10% { opacity: 1; transform: translateY(0); }
                90% { opacity: 1; transform: translateY(0); }
                100% { opacity: 0; transform: translateY(-10px); }
            }
        `;
        document.head.appendChild(style);

        // ── Load history ──
        async function loadHistory(sessionId) {
            try {
                const r = await fetch(`/history/${sessionId}?limit=20`);
                const data = await r.json();
                if (data.messages) {
                    data.messages.forEach(msg => {
                        addBubble(msg.role === 'user' ? 'user' : 'ai', msg.content);
                    });
                }
            } catch (e) { console.warn('History load failed', e); }
        }

        // Prevent touch scroll on mic button
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.btn-mic')) e.preventDefault();
        }, { passive: false });
    </script>

</body>

</html>
